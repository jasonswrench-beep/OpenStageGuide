[package]
name = "openstage-guide-shell"
version = "1.0.0"
description = "The OpenStage Guide window: a Tauri shell around the program's local server"
authors = ["Jason S. Wrench"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
